<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | WinBig</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="logo"><img src="/img/favicon.svg" alt=""><span>Win<b>Big</b></span></a>
    </div>
  </header>
  <main class="auth-page">
    <form class="auth-card" data-auth="signup" novalidate>
      <h1>Create your account</h1>
      <p class="sub">Sign up to buy tickets. Your entries are saved to your account, so you can always see them.</p>
      <div class="field-row">
        <label class="field"><span>First name</span><input id="f-first" autocomplete="given-name" required maxlength="50"></label>
        <label class="field"><span>Surname</span><input id="f-last" autocomplete="family-name" required maxlength="50"></label>
      </div>
      <label class="field"><span>Email address</span><input id="f-email" type="email" autocomplete="email" required maxlength="120"></label>
      <label class="field"><span>Cellphone number</span><input id="f-phone" type="tel" autocomplete="tel" required placeholder="082 123 4567"></label>
      <label class="field"><span>Password</span><input id="f-password" type="password" autocomplete="new-password" required minlength="8">
        <small>At least 8 characters.</small></label>
      <label class="check"><input id="f-agree" type="checkbox">
        <span>I am 18 or older and I accept the <a href="/terms" target="_blank">terms &amp; conditions</a>.</span></label>
      <p class="form-error" id="form-error" role="alert"></p>
      <button class="btn btn-lg" type="submit">Create account</button>
      <p class="auth-switch">Already have an account? <a href="/signin" data-keep-next>Sign in</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
