<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | WinBig</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="logo"><img src="/img/favicon.svg" alt=""><span>Win<b>Big</b></span></a>
    </div>
  </header>
  <main class="auth-page">
    <form class="auth-card" data-auth="signin" novalidate>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to buy tickets and see your entries.</p>
      <label class="field"><span>Email address</span><input id="f-email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input id="f-password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="form-error" role="alert"></p>
      <button class="btn btn-lg" type="submit">Sign in</button>
      <p class="auth-switch">New to WinBig? <a href="/signup" data-keep-next>Create an account</a></p>
      <p class="auth-switch"><small>Forgot your password? Contact us and we'll reset it for you.</small></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
